# 本地开发用的中间件：MySQL + Redis + RabbitMQ + GreptimeDB
# 启动：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
# RabbitMQ 仅“问题反馈”功能使用，后端采用懒加载。不开发相关功能时可以不启动。
services:
  mysql:
    image: mysql:8.0
    container_name: weihuda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weihuda
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: weihuda-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: weihuda-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  greptimedb:
    image: greptime/greptimedb:1.1.4
    container_name: weihuda-greptimedb
    ports:
      - "4000:4000"
    command:
      - standalone
      - start
      - --http-addr=0.0.0.0:4000
    volumes:
      - greptimedb_data:/tmp/greptimedb

volumes:
  mysql_data:
  greptimedb_data:
