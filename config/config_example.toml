[server]
name = "back_2024"
address = "0.0.0.0:8000"
# 后端在启动后除了上报 trace 外还会向标准输出中打印日志，日志是 pretty 格式的，便于阅读
# 日志等级："debug", "info", "warn", "error"
# 该日志等级只会影响标准输出的日志，不影响上报 trace 的日志等级
log_level = "info"

[database]
max_connections = 100
database_url = "mysql://用户名:密码@ip地址:端口/weihuda"

[redis]
redis_url = "redis://用户名:密码@ip地址:端口/"

[wechat]
appid = ""
secret = ""

[captcha]
# 验证码服务地址，目前用于识别大物实验平台的验证码。结尾不要加斜杠。
captcha_url = "http://ip地址:端口"

[rabbitmq]
# VirtualHost名称如果为"/"，需要写成 "%2f"
url = "amqp://用户名:密码@ip地址:端口号/virtualHost名称"
# 设置反馈消息应该发送到哪个 exchange
feedback_exchange = "feedback"

[secret]
# jwt 的密钥
jwt = ""
# 数据库中存储的密码加密用的密钥
password = ""

[pow]
# 是否启用 pow 校验，默认为 true；false 时绑定接口跳过 pow 验证
enabled = true
# 工作量证明过期时间，单位：秒
expired_time = 300
# 工作量证明难度，值越大，难度越大
difficulty = 4

# 可观测性（可选）。如果不配置整个 observability 段，或是不配置 endpoint，则不上报 tracing。
[observability]
# GreptimeDB 的 OTLP base（代码会自动在末尾追加 /v1/traces）
endpoint = "http://localhost:4000/v1/otlp"
# OTLP resource 的 service.name。不配置时默认为 "weihuda_backend"
service_name = "weihuda_backend"
# Basic Auth（GreptimeDB 未开启鉴权时省略下面两行）
# username = ""
# password = ""
